
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "swot-wse"
version = "0.2.0"

description = "Python package for extracting reservoir Water Surface Elevation (WSE) time series from SWOT Level 2 LakeSP Vector Data Product."

readme = "README.md"
requires-python = ">=3.10"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Ongkar Dasgupta" }
]

keywords = [
    "Reservoir",
    "Water Surface Elevation",
    "SWOT",
    "LakeSP",
    "Remote Sensing",
    "Hydrology",
    "Earth Observation"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology"
]

dependencies = [
    "earthaccess",
    "earthengine-api",
    "geemap",
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "tqdm",
    "fiona",
    "pyproj",
    "shapely"
]


[project.scripts]
swot-wse = "swot_wse.cli:main"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = ["swot_wse*"]
exclude = [
    "cache*",
    "data*",
    "build*",
    "downloads*",
    "outputs*",
    "tests*"
]
